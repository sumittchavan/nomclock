name: CI

on:
  workflow_call:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Unit tests (targets, aggregation, suggestions)
        run: pnpm --filter @nutrisnap/shared test

      - name: Database security checks (RLS, storage, cascade delete)
        run: pnpm test:db

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci

      - name: Bundle mobile app (iOS + Android)
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --platform android --output-dir /tmp/expo-out
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci
          EXPO_NO_TELEMETRY: 1

      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Typecheck edge functions
        run: deno check supabase/functions/*/index.ts
