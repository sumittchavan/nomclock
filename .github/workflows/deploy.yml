name: Deploy

# push to main  → database migrations + edge functions, over-the-air update to the apps
#                 (the website deploys itself through Vercel's GitHub integration)
# tag v*        → also builds new iOS/Android binaries with EAS and submits them to the stores
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push
      - name: Set function secrets (only those stored in GitHub; never blanks existing ones)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          args=()
          [ -n "$ANTHROPIC_API_KEY" ] && args+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
          [ -n "$USDA_API_KEY" ] && args+=("USDA_API_KEY=$USDA_API_KEY")
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}"; else echo "No secrets in GitHub; keeping the ones in Supabase."; fi
      - name: Deploy edge functions
        run: supabase functions deploy analyze-meal coach-chat delete-account --project-ref "$PROJECT_REF"

  mobile:
    needs: backend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: apps/mobile }
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Over-the-air update (JavaScript changes reach installed apps)
        if: github.ref_type == 'branch'
        run: eas update --channel production --message "${{ github.event.head_commit.message || 'manual deploy' }}" --non-interactive

      - name: Store build and submit (iOS App Store + Google Play)
        if: github.ref_type == 'tag'
        run: eas build --platform all --profile production --non-interactive --no-wait --auto-submit
