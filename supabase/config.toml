project_id = "nomclock"

[api]
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[storage]
file_size_limit = "8MiB"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["nomclock://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[functions.analyze-meal]
verify_jwt = false  # each function verifies the user itself (works with new asymmetric JWT keys)

[functions.coach-chat]
verify_jwt = false  # each function verifies the user itself (works with new asymmetric JWT keys)

[functions.delete-account]
verify_jwt = false  # each function verifies the user itself (works with new asymmetric JWT keys)
